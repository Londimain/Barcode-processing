<script>
let productMap = []; // Словарь соответствия будет загружен из Excel или резервного источника
let splitFileData = null; // Данные загруженного файла для разделения
let originalFileName = ''; // Оригинальное имя файла для разделения
let currentResult = ''; // Результат обработки двух файлов

// Элементы DOM
const textarea = document.getElementById('dataInput');
const sumLinesField = document.getElementById('sumLines');
const sumCalculationField = document.getElementById('sumCalculation');
const productNameField = document.getElementById('productName');
const packagesCountField = document.getElementById('packagesCount');
const bottlesPerPackageField = document.getElementById('bottlesPerPackage');
const statusElement = document.getElementById('status');
const statusTwoFilesElement = document.getElementById('statusTwoFiles');

/**
 * Функция поиска названия продукта по префиксу
 * @param {*} input — входные данные (префикс для поиска)
 * @param {Array} productMap — словарь сопоставления префиксов и названий (опционально, если доступна глобальная переменная)
 * @returns {string} — найденное название или 'Не определено'
 */
function findProductName(input, productMapOverride) {
    // Используем переданный словарь или глобальную переменную
    const mapToUse = productMapOverride || productMap;

    // Проверка входных данных и словаря
    if (!input || !mapToUse || mapToUse.length === 0) {
        console.log('Словарь пуст или входные данные отсутствуют');
        return 'Не определено';
    }

    const trimmedInput = String(input).trim();

    console.log('Ищем префикс в строке:', trimmedInput);
    console.log('Словарь для поиска:', mapToUse);

    // Поиск первого совпадения по префиксу
    for (const item of mapToUse) {
        // Проверяем наличие обязательных полей
        if (!item || !item.prefix) {
            console.warn('Пропущен элемент без поля prefix:', item);
            continue;
        }

        const prefix = String(item.prefix).trim();

        // Если строка начинается с префикса — возвращаем название
        if (trimmedInput.startsWith(prefix)) {
            console.log('Найдено совпадение:', prefix, '->', item.name);
            return item.name || 'Не определено'; // Защита от отсутствующего поля name
        }
    }

    console.log('Совпадений не найдено');
    return 'Не определено';
}




// Обработчики для полей ввода чисел
packagesCountField.addEventListener('input', updateCalculation);
bottlesPerPackageField.addEventListener('input', updateCalculation);

// Функция пересчёта суммы товара на основе количества упаковок и бутылок в упаковке
function updateCalculation() {
    const packagesCount = parseFloat(packagesCountField.value) || 0;
    const bottlesPerPackage = parseFloat(bottlesPerPackageField.value) || 0;
    sumCalculationField.value = packagesCount * bottlesPerPackage;
}



/**
 * Сохранение данных в файл .txt с обработкой строк
 */

// Обработчик ввода в текстовом поле
textarea.addEventListener('input', async function() {
    // Сохраняем позицию курсора и прокрутки
    const cursorPosition = textarea.selectionStart;
    const scrollTop = textarea.scrollTop;

    // Разбиваем текст на строки
    const lines = textarea.value.split('\n');
    const uniqueLines = new Set();
    const processedLines = [];

    // Ждём загрузки словаря, если он ещё не загружен
    if (!productMap || productMap.length === 0) {
        await loadProductMapFromExcel();
    }

    // Определяем название продукта для первой подходящей строки
    let productName = 'Не определено';
    for (const line of lines) {
        const trimmedLine = line.trim();
        if (trimmedLine) {
            productName = findProductName(trimmedLine);
            if (productName !== 'Не определено') {
                break;
            }
        }
    }
    productNameField.value = productName;

    // Остальная логика обработки строк
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 120;
    let lineCounter = 0;
    let currentParty = 1;

    lines.forEach(line => {
        const trimmedLine = line.trim();
        if (trimmedLine && !uniqueLines.has(trimmedLine)) {
            uniqueLines.add(trimmedLine);
            lineCounter++;
            currentParty = Math.ceil(lineCounter / unitsPerBatch);
            processedLines.push(line);
        } else if (!trimmedLine) {
            processedLines.push(line);
        }
    });

    const newValue = processedLines.join('\n');

    if (newValue !== textarea.value) {
        textarea.value = newValue;
    }

    textarea.scrollTop = scrollTop;

    if (textarea.value.length === textarea.value.length) {
        textarea.setSelectionRange(cursorPosition, cursorPosition);
    } else {
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }

    updateSumLinesWithParties(uniqueLines.size);
});





// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', async function() {
  // ИНИЦИАЛИЗИРУЕМ отслеживание партий и нулевого состояния при загрузке
  sessionStorage.setItem('lastPartyNumber', '0');
  sessionStorage.setItem('wasZeroParties', 'true');
  console.log('🔔 Отслеживание партий инициализировано (0, wasZeroParties=true)');

  // Инициализируем словарь при загрузке страницы
  await loadProductMapFromExcel();

  // Устанавливаем значение по умолчанию для поля единиц в партии
  document.getElementById('unitsPerBatch').value = '120';

  // Инициализируем отображение информации о партиях
  updateSumLinesWithParties(0);

  // Добавляем обработчик изменения для поля "Количество единиц в партии"
  document.getElementById('unitsPerBatch').addEventListener('input', function() {
    const lines = textarea.value.split('\n');
    const uniqueLines = new Set();

    lines.forEach(line => {
      if (line.trim() && !uniqueLines.has(line.trim())) {
        uniqueLines.add(line.trim());
      }
    });

    updateSumLinesWithParties(uniqueLines.size);
  });

  // Добавляем обработчик для поля загрузки Excel-файла
  document.getElementById('excelFileInput').addEventListener('change', function() {
    loadProductMapFromExcel().then(() => {
      // После загрузки словаря перепроверяем текущее содержимое текстового поля
      if (textarea.value.trim()) {
        textarea.dispatchEvent(new Event('input'));
      }
    });
  });

  // === ОБРАБОТЧИКИ ДЛЯ ЧЕКБОКСОВ РЕГИОНОВ (РБ/РФ) ===
  const regionRB = document.getElementById('regionRB');
  const regionRF = document.getElementById('regionRF');

  regionRB.addEventListener('change', function() {
    if (this.checked) {
      // Если выбрали РБ, снимаем отметку с РФ
      regionRF.checked = false;
    }
    // Если сняли выбор с РБ, ничего не делаем — другой чекбокс остаётся как есть
  });

  regionRF.addEventListener('change', function() {
    if (this.checked) {
      // Если выбрали РФ, снимаем отметку с РБ
      regionRB.checked = false;
    }
    // Если сняли выбор с РФ, ничего не делаем — другой чекбокс остаётся как есть
  });






  // Разделение файла по количеству кодов
  document.getElementById('splitFileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];

    if (!file) {
        splitFileInfo.textContent = 'Файл не выбран';
        return;
    }

    originalFileName = file.name;

    const reader = new FileReader();

    reader.onload = function(e) {
        const content = e.target.result;
        // Разделяем на строки и обрезаем пробелы
        let lines = content.split('\n').map(line => line.trim());

        // Удаляем дубликаты, сохраняя порядок
        const uniqueLines = [];
        const seen = new Set();

        for (const line of lines) {
            if (!seen.has(line)) {
                seen.add(line);
                uniqueLines.push(line);
            }
        }

        // УДАЛЯЕМ ПУСТЫЕ СТРОКИ
        const nonEmptyUniqueLines = uniqueLines.filter(line => line.length > 0);

        splitFileData = nonEmptyUniqueLines;

        const totalLines = splitFileData.length;
        const codesPerFile = parseInt(document.getElementById('codesPerFile').value) || 100;
        const totalFiles = Math.ceil(totalLines / codesPerFile);

        splitFileInfo.innerHTML = `
            <strong>Файл загружен:</strong> ${file.name}<br>
            <strong>Всего строк (после обработки):</strong> ${totalLines}
        `;

        showSplitStatus('Файл загружен и обработан. Готов к разделению.', 'info');
    };

    reader.onerror = function() {
        splitFileInfo.textContent = 'Ошибка при чтении файла';
        showSplitStatus('Ошибка при загрузке файла.', 'error');
    };

    // Проверка расширения файла с использованием substring
    const fileName = file.name.toLowerCase();
    if (file.type === 'text/plain' || fileName.substring(fileName.length - 4) === '.txt') {
        reader.readAsText(file);
    } else if (fileName.substring(fileName.length - 4) === '.csv') {
        reader.readAsText(file);
    } else {
        reader.readAsText(file);
    }
// <br><strong>Будет создано файлов (по ${codesPerFile} кодов):</strong> ${totalFiles} - удалил, там где остальные <strong>
});



});









// Вспомогательная функция для отображения статуса
function showSplitStatus(message, type) {
    splitStatus.textContent = message;
    splitStatus.className = `status ${type}`;

    // Автоматически скрываем сообщение через 5 секунд
    setTimeout(() => {
        splitStatus.textContent = '';
        splitStatus.className = 'status';
    }, 5000);
}

// === РАСШИРЕННАЯ ОБРАБОТКА ФАЙЛА ===

const advancedFileInput = document.getElementById('advancedFile');

advancedFileInput.addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const content = e.target.result;
        const processedContent = processContent(content);

        // Автоматическое сохранение в файл с именем исходного файла + "_processed"
        let fileName = file.name.replace(/\.[^.]+$/, '_processed.txt');
        saveToFile(processedContent, fileName);
    };

    // Звуковое оповещение
    playNotificationSound('split_save');

    reader.readAsText(file);
});

// Функция обработки содержимого для расширенной обработки
function processContent(content) {
    const lines = content.split('\n');
    const allFragments = [];

    // Шаг 1: предварительная очистка — удаляем все пробельные символы
    const cleanLines = lines.map(line => line.replace(/\s/g, ''));
        // Шаг 2: разбиваем каждую строку на фрагменты с учётом наличия 
    for (const line of cleanLines) {
        if (!line) {
            allFragments.push(''); // Сохраняем пустые строки временно
            continue;
        }

        let start = 0;
        while (start < line.length) {
            // Определяем длину фрагмента
            let chunkLength;
            if (start + 31 < line.length && line[start + 31] === '') {
                // Если после 31‑го символа есть , берём 38 символов
                chunkLength = 38;
            } else {
                // Иначе берём 37 символов
                chunkLength = 37;
            }

            const fragment = line.substring(start, start + chunkLength);

            // Пропускаем фрагменты длиной 1 символ
            if (fragment.length !== 1) {
                allFragments.push(fragment);
            }

            start += chunkLength;
        }
    }

    // Шаг 3: добавляем символ  после 31‑го столбца, если его нет
    const withSeparator = allFragments.map(fragment => {
        if (fragment.length <= 31) return fragment; // Не добавляем, если строка короче 31 символа

        // Проверяем, есть ли уже  на 32‑й позиции (индекс 31)
        if (fragment[31] === '') {
            return fragment; // Уже есть, оставляем как есть
        }

        // Вставляем  после 31‑го символа
        return fragment.substring(0, 31) + '' + fragment.substring(31);
    });

    // Шаг 4: удаляем дубликаты строк
    const uniqueFragments = [...new Set(withSeparator)];

    // Шаг 5: финальная фильтрация — удаляем строки длиной 1 символ (если появились после предыдущих операций)
    const filteredFragments = uniqueFragments.filter(fragment =>
        fragment.length !== 1
    );

    // Шаг 6: удаляем пустые строки перед финальным объединением
    const noEmptyLines = filteredFragments.filter(fragment => fragment.trim() !== '');

    // Шаг 7: объединяем строки с CR+LF в конце каждой строки, добавляем перенос в конце файла
    const result = noEmptyLines.join('\r\n') + '\r\n';

    return result;
}

// Функция автоматического сохранения в файл
function saveToFile(content, fileName) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Показываем статус сохранения
    statusElement.textContent = `Файл "${fileName}" успешно сохранён!`;
    statusElement.className = 'status success';

    setTimeout(() => {
        statusElement.textContent = '';
        statusElement.className = 'status';
    }, 3000);
}





// Вспомогательная функция для разбиения длинных строк
function splitLongLines(lines) {
    const result = [];
    for (const line of lines) {
        if (line.length <= 37) {
            result.push(line);
        } else {
            // Разбиваем строку на части по 38 символов
            for (let i = 0; i < line.length; i += 37) {
                result.push(line.substring(i, i + 37));
            }
        }
    }
    return result;
}







// Функция для обновления поля sumLinesField с информацией о сумме и партии
function updateSumLinesWithParties(totalLines) {
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 120;
    const totalParties = Math.ceil(totalLines / unitsPerBatch);
    let displayText = '';

    if (totalLines === 0) {
        displayText = 'Товара: нет; партий: нет';
    } else {
        displayText = `RQ Code: ${totalLines}; Партия №${totalParties}`;
    }

    sumLinesField.value = displayText;

    // Получаем состояние чекбокса
    const soundCheckbox = document.getElementById('soundNotification');
    const isSoundEnabled = soundCheckbox && soundCheckbox.checked;

    if (!isSoundEnabled) return; // Если звук отключён, выходим


    // ПОЛУЧАЕМ ПРЕДЫДУЩЕЕ ЗНАЧЕНИЕ ПАРТИИ И ФЛАГ НУЛЕВОГО СОСТОЯНИЯ
    let previousParties = 0;
    let wasZeroParties = false;

    const storedValue = sessionStorage.getItem('lastPartyNumber');
    const storedZeroFlag = sessionStorage.getItem('wasZeroParties');

    if (storedValue !== null) {
        previousParties = parseInt(storedValue);
    }
    if (storedZeroFlag !== null) {
        wasZeroParties = storedZeroFlag === 'true';
    }

    // ФЛАГ для определения необходимости оповещения
    let shouldNotify = false;

    // УСЛОВИЕ 1: Переход от «нет партий» (0) к любой положительной партии
    if ((previousParties === 0 || wasZeroParties) && totalParties > 0) {
        shouldNotify = true;
        console.log(`🔔 Первая партия после отсутствия! Текущая: ${totalParties}`);
        // Сбрасываем флаг нулевого состояния после срабатывания
        sessionStorage.setItem('wasZeroParties', 'false');
    }
    // УСЛОВИЕ 2: Увеличение количества партий
    else if (totalParties > previousParties) {
        shouldNotify = true;
        console.log(`🔔 Новая партия! Текущая: ${totalParties}, Предыдущая: ${previousParties}`);
    }
    // УСЛОВИЕ 3: Уменьшение количества партий (например, при изменении unitsPerBatch)
    else if (totalParties < previousParties && totalParties > 0) {
        shouldNotify = true;
        console.log(`🔔 Изменение партии! Текущая: ${totalParties}, Предыдущая: ${previousParties} (уменьшение)`);
    }

    // Обновляем флаг нулевого состояния
    if (totalParties === 0) {
        sessionStorage.setItem('wasZeroParties', 'true');
    }

    // Воспроизводим звук, если нужно оповестить
    if (shouldNotify) {
        // Сохраняем новое значение
        sessionStorage.setItem('lastPartyNumber', totalParties.toString());
        // Воспроизводим звук
        playNotificationSound('party');
    }
}

        // Обработчик ввода в текстовом поле
        textarea.addEventListener('input', function() {
    // Сохраняем позицию курсора и прокрутки *до* обработки
    const cursorPosition = textarea.selectionStart;
    const scrollTop = textarea.scrollTop;

    // Удаляем все символы  из текста
    const cleanedValue = textarea.value.replace(//g, '');

    if (cleanedValue !== textarea.value) {
        textarea.value = cleanedValue;
    }

    // Разбиваем текст на строки по символу переноса (Enter)
    const lines = textarea.value.split('\n');
    const uniqueLines = new Set();
    const processedLines = [];

    // Определяем название продукта для первой подходящей строки
    let productName = 'Не определено';
    for (const line of lines) {
        const trimmedLine = line.trim();
        if (trimmedLine) {
            productName = findProductName(trimmedLine);
            if (productName !== 'Не определено') {
                break;
            }
        }
    }
    productNameField.value = productName;

    // Получаем количество единиц в партии
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 120;

    let lineCounter = 0;
    let currentParty = 1;

    lines.forEach(line => {
        // Обрабатываем только непустые строки и удаляем дубликаты
        const trimmedLine = line.trim();
        if (trimmedLine && !uniqueLines.has(trimmedLine)) {
            uniqueLines.add(trimmedLine);
            lineCounter++;
            currentParty = Math.ceil(lineCounter / unitsPerBatch);
            // Сохраняем исходную строку (с переносами) без добавления CRLF внутри
            processedLines.push(line); // Важно: не добавляем \r\n здесь
        } else if (!trimmedLine) {
            // Пустые строки сохраняем как есть — это позволяет Enter работать нормально
            processedLines.push(line);
        }
    });

    // Собираем строки обратно через \n (естественные переносы)
    const newValue = processedLines.join('\n');

    // Только если содержимое реально изменилось, обновляем textarea
    if (newValue !== textarea.value) {
        textarea.value = newValue;
    }

    // Восстанавливаем позицию прокрутки
    textarea.scrollTop = scrollTop;

    // Восстанавливаем позицию курсора
    // Если длина текста не изменилась, позиция остаётся той же
    if (textarea.value.length === textarea.value.length) {
        textarea.setSelectionRange(cursorPosition, cursorPosition);
    } else {
        // Если текст изменился, ставим курсор в конец
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }

    // Обновляем счётчик строк и информацию о партиях
    updateSumLinesWithParties(uniqueLines.size);
});
