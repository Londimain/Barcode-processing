let productMap = []; // Словарь соответствия будет загружен из Excel или резервного источника

const textarea = document.getElementById('dataInput');

// Функция поиска названия по префиксу (улучшенная версия)
function findProductName(input) {
    if (!input || !productMap) return 'Не определено';

    const trimmedInput = String(input).trim();


    for (const item of productMap) {
        const prefix = String(item.prefix).trim();
        if (trimmedInput.startsWith(prefix)) {
            return item.name;
        }
    }
    return 'Не определено';
}

function findProductName(input) {
    if (!input || !productMap || productMap.length === 0) {
        console.log('Словарь пуст или входные данные отсутствуют');
        return 'Не определено';
    }

    const trimmedInput = String(input).trim();
    console.log('Ищем префикс в строке:', trimmedInput);
    console.log('Словарь для поиска:', productMap);

    for (const item of productMap) {
        const prefix = String(item.prefix).trim();
        if (trimmedInput.startsWith(prefix)) {
            console.log('Найдено совпадение:', prefix, '->', item.name);
            return item.name;
        }
    }
    console.log('Совпадений не найдено');
    return 'Не определено';
}

// Функция загрузки данных из Excel вручную
async function loadProductMapFromExcel() {
    // Очищаем словарь перед загрузкой
    productMap = [];

    const fileInput = document.getElementById('excelFileInput');
    const file = fileInput.files[0];

    if (!file) {
        // Используем резервный словарь
        productMap = [
            { prefix: '0104810178006287', name: 'Берёза квас лайм 1.0' },
            { prefix: '0104810178006188', name: 'Берёза квас лайм 1.5' },
            { prefix: '0104810178006294', name: 'Берёза квас классик 1.0' },
            { prefix: '0104810178007789', name: 'Берёза квас имбирь 1.0' },
            { prefix: '0104810178005921', name: 'Подникольский квас 1.5' },
            { prefix: '0194819008570004', name: 'Берёза квас имбирь 1.5 обычный' }
        ];
        console.log('Используется резервный словарь продуктов');
        return;
    }

    try {
        const arrayBuffer = await file.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        // Получаем все данные листа (включая заголовки)
        const excelData = XLSX.utils.sheet_to_json(worksheet, {
            header: 1,
            defval: ''
        });

        console.log('Сырые данные из Excel:', excelData);

        // Обрабатываем данные, начиная со второй строки (пропускаем заголовки)
        productMap = excelData.slice(1).map(row => {
            // Гарантируем, что берём только первые два столбца
            const prefixCell = row[0];
            const nameCell = row[1];

            // Преобразуем в строку и очищаем от пробелов
            let prefix = '';
            if (prefixCell !== undefined && prefixCell !== null) {
                prefix = String(prefixCell).trim();
            }

            let name = 'Не определено';
            if (nameCell !== undefined && nameCell !== null) {
                name = String(nameCell).trim();
                if (!name) name = 'Не определено';
            }

            return { prefix, name };
        }).filter(item => item.prefix && item.prefix.length > 0);

        console.log('Обработанный словарь productMap:', productMap);
        alert(`Словарь продуктов успешно загружен из файла! Найдено ${productMap.length} записей.`);
    } catch (error) {
        console.error('Ошибка при загрузке Excel-файла:', error);
        alert('Ошибка при загрузке файла. Используется резервный словарь.');
        productMap = [
            { prefix: '0104810178006287', name: 'Берёза квас лайм 1.0' },
            { prefix: '0104810178006188', name: 'Берёза квас лайм 1.5' },
            { prefix: '0104810178006294', name: 'Берёза квас классик 1.0' },
            { prefix: '0104810178007789', name: 'Берёза квас имбирь 1.0' },
            { prefix: '0104810178005921', name: 'Подникольский квас 1.5' },
            { prefix: '0194819008570004', name: 'Берёза квас имбирь 1.5 обычный' }
        ];
    }
}

// Функция для обновления поля sumLinesField с информацией о сумме и партии
function updateSumLinesWithParties(totalLines) {
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 300;
    const totalParties = Math.ceil(totalLines / unitsPerBatch);
    let displayText = '';

    if (totalLines === 0) {
        displayText = 'Товара: нет; партий: нет';
    } else {
        displayText = `RQ Code: ${totalLines}; Партия №${totalParties}`;
    }

    sumLinesField.value = displayText;

    // Получаем состояние чекбокса
    const soundCheckbox = document.getElementById('soundNotification');
    const isSoundEnabled = soundCheckbox && soundCheckbox.checked;

    if (!isSoundEnabled) return; // Если звук отключён, выходим

    // ПОЛУЧАЕМ ПРЕДЫДУЩЕЕ ЗНАЧЕНИЕ ПАРТИИ
    let previousParties = 0;
    const storedValue = sessionStorage.getItem('lastPartyNumber');

    if (storedValue !== null) {
        previousParties = parseInt(storedValue);
    }

    // ФЛАГ для определения необходимости оповещения
    let shouldNotify = false;

    // УСЛОВИЕ 1: Переход от «нет партий» (0) к любой положительной партии
    if (previousParties === 0 && totalParties > 0) {
        shouldNotify = true;
        console.log(`🔔 Первая партия после сброса! Текущая: ${totalParties}`);
    }
    // УСЛОВИЕ 2: Увеличение количества партий
    else if (totalParties > previousParties) {
        shouldNotify = true;
        console.log(`🔔 Новая партия! Текущая: ${totalParties}, Предыдущая: ${previousParties}`);
    }
    // УСЛОВИЕ 3: Уменьшение количества партий (например, при изменении unitsPerBatch)
    else if (totalParties < previousParties && totalParties > 0) {
        shouldNotify = true;
        console.log(`🔔 Изменение партии! Текущая: ${totalParties}, Предыдущая: ${previousParties} (уменьшение)`);
    }

    // Воспроизводим звук, если нужно оповестить
    if (shouldNotify) {
        // Сохраняем новое значение
        sessionStorage.setItem('lastPartyNumber', totalParties.toString());
        // Воспроизводим звук
        playNotificationSound();
    }
}

// Обработчики для полей ввода чисел
packagesCountField.addEventListener('input', updateCalculation);
bottlesPerPackageField.addEventListener('input', updateCalculation);

function updateCalculation() {
    const packagesCount = parseFloat(packagesCountField.value) || 0;
    const bottlesPerPackage = parseFloat(bottlesPerPackageField.value) || 0;
    sumCalculationField.value = packagesCount * bottlesPerPackage;
}

// ФУНКЦИЯ ОЧИСТКИ ВСЕХ ПОЛЕЙ
function clearAllFields() {
    // Очищаем левое текстовое поле
    textarea.value = '';
    // Очищаем все правые поля ввода
    sumLinesField.value = '';
    sumCalculationField.value = '';
    productNameField.value = '';
    packagesCountField.value = '';
    bottlesPerPackageField.value = '';
    document.getElementById('unitsPerBatch').value = '300'; // Сброс до значения по умолчанию

    // ГАРАНТИРОВАННЫЙ СБРОС отслеживания партий и флагов
    sessionStorage.removeItem('lastPartyNumber');
    sessionStorage.removeItem('wasZeroParties');
    sessionStorage.setItem('lastPartyNumber', '0');
    sessionStorage.setItem('wasZeroParties', 'true'); // Явно указываем, что было нулевое состояние

    console.log('✅ Отслеживание партий полностью сброшено. Следующие партии будут оповещаться с №1.');
}

// Функция сохранения данных в файл .txt
function saveDataAsFile() {
    let data = textarea.value;

    if (!data) {
        alert('Поле для сохранения пустое!');
        return;
    }

    // Получаем название продукта из соответствующего поля
    const productName = productNameField.value.trim();
    if (!productName || productName === 'Не определено') {
        alert('Не удалось определить название продукта. Проверьте данные в поле "Название продукта"');
        return;
    }

    // Разделяем на строки, удаляем пустые и строки с пробелами
    const lines = data.split('\n');
    const nonEmptyLines = lines.filter(line => line.trim().length > 0);

    if (nonEmptyLines.length === 0) {
        alert('Нет данных для сохранения — все строки пустые!');
        return;
    }

    // Обрабатываем каждую строку: вставляем символ  после 31‑го символа только если его там ещё нет
    const processedLines = nonEmptyLines.map(line => {
        if (line.length <= 31) {
            return line;
        }
        if (line[31] === '') {
            return line;
        }
        return line.slice(0, 31) + '' + line.slice(31);
    });

    data = processedLines.join('\r\n') + '\r\n';

    // Преобразуем строку в Uint8Array для гарантированной корректной кодировки
    const uint8Array = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) {
        uint8Array[i] = data.charCodeAt(i);
    }

    // Создаём Blob с данными, явно указывая кодировку
    const blob = new Blob([uint8Array], { type: 'text/plain;charset=utf-8' });

    // Формируем имя файла: используем ТОЛЬКО название продукта
    // ... продолжение функции saveDataAsFile()
const fileName = `${productName}.txt`;

// Создаём ссылку для скачивания
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = fileName;

// Добавляем ссылку в документ, запускаем клик и удаляем ссылку
document.body.appendChild(link);
link.click();
document.body.removeChild(link);

// Освобождаем URL-объект
URL.revokeObjectURL(link.href);
}

// Обработчик ввода в текстовом поле
textarea.addEventListener('input', async function() {
    // Сохраняем позицию курсора и прокрутки
    const cursorPosition = textarea.selectionStart;
    const scrollTop = textarea.scrollTop;

    // Разбиваем текст на строки
    const lines = textarea.value.split('\n');
    const uniqueLines = new Set();
    const processedLines = [];

    // Ждём загрузки словаря, если он ещё не загружен
    if (!productMap || productMap.length === 0) {
        await loadProductMapFromExcel();
    }

    // Определяем название продукта для первой подходящей строки
    let productName = 'Не определено';
    for (const line of lines) {
        const trimmedLine = line.trim();
        if (trimmedLine) {
            productName = findProductName(trimmedLine);
            if (productName !== 'Не определено') {
                break;
            }
        }
    }
    productNameField.value = productName;

    // Остальная логика обработки строк
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 300;
    let lineCounter = 0;
    let currentParty = 1;

    lines.forEach(line => {
        const trimmedLine = line.trim();
        if (trimmedLine && !uniqueLines.has(trimmedLine)) {
            uniqueLines.add(trimmedLine);
            lineCounter++;
            currentParty = Math.ceil(lineCounter / unitsPerBatch);
            processedLines.push(line);
        } else if (!trimmedLine) {
            processedLines.push(line);
        }
    });

    const newValue = processedLines.join('\n');

    if (newValue !== textarea.value) {
        textarea.value = newValue;
    }

    textarea.scrollTop = scrollTop;

    if (textarea.value.length === textarea.value.length) {
        textarea.setSelectionRange(cursorPosition, cursorPosition);
    } else {
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }

    updateSumLinesWithParties(uniqueLines.size);
});

// Функция воспроизведения звукового оповещения
function playNotificationSound() {
    const audio = document.getElementById('notificationSound');

    if (!audio) {
        console.error('Аудиоэлемент с ID "notificationSound" не найден!');
        return;
    }

    // Перематываем на начало
    audio.currentTime = 0;

    // Пытаемся воспроизвести
    const playPromise = audio.play();

    if (playPromise !== undefined) {
        playPromise
            .then(() => {
                console.log('Звук успешно воспроизведён');
            })
            .catch(error => {
                console.error('Ошибка воспроизведения звука:', error);
                // Альтернативное уведомление, если звук заблокирован
                alert('Новая партия добавлена! (звук заблокирован браузером)');
            });
    }
}

// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', async function() {
    // ИНИЦИАЛИЗИРУЕМ отслеживание партий и нулевого состояния при загрузке
    sessionStorage.setItem('lastPartyNumber', '0');
    sessionStorage.setItem('wasZeroParties', 'true');
    console.log('🔔 Отслеживание партий инициализировано (0, wasZeroParties=true)');
    // Инициализируем словарь при загрузке страницы
    await loadProductMapFromExcel();

    // Устанавливаем значение по умолчанию для поля единиц в партии
    document.getElementById('unitsPerBatch').value = '300';

    // Инициализируем отображение информации о партиях
    updateSumLinesWithParties(0);

    // Добавляем обработчик изменения для поля "Количество единиц в партии"
    document.getElementById('unitsPerBatch').addEventListener('input', function() {
        const lines = textarea.value.split('\n');
        const uniqueLines = new Set();

        lines.forEach(line => {
            if (line.trim() && !uniqueLines.has(line.trim())) {
                uniqueLines.add(line.trim());
            }
        });

        updateSumLinesWithParties(uniqueLines.size);
    });

    // Добавляем обработчик для поля загрузки Excel-файла
    document.getElementById('excelFileInput').addEventListener('change', function() {
        loadProductMapFromExcel().then(() => {
            // После загрузки словаря перепроверяем текущее содержимое текстового поля
            if (textarea.value.trim()) {
                textarea.dispatchEvent(new Event('input'));
            }
        });
    });
});

// === РАЗДЕЛЕНИЕ ФАЙЛА ПО КОЛИЧЕСТВУ КОДОВ ===

// Обработчик выбора файла для разделения
document.getElementById('splitFileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    originalFileName = file.name; // Сохраняем оригинальное имя

    const reader = new FileReader();

    reader.onload = function(e) {
        const content = e.target.result;
        // Разделяем на строки, обрезаем пробелы и удаляем пустые строки
        splitFileData = content.split('\n')
            .map(line => line.trim())
            .filter(line => line !== '');

        // Показываем количество строк в файле (после удаления пустых)
        const totalLines = splitFileData.length;
        splitFileInfo.textContent = `Выбран файл: "${originalFileName}". Всего строк (без пустых): ${totalLines}.`;
        splitFileInfo.className = 'file-info';
    };

    reader.readAsText(file);
});

// Функция разделения файла
function splitFile() {
    // Проверяем, загружен ли файл
    if (!splitFileData) {
        showSplitStatus('Пожалуйста, выберите файл для разделения.', 'error');
        return;
    }

    // Получаем количество кодов в одном файле
    const codesPerFile = parseInt(document.getElementById('codesPerFile').value);
    if (isNaN(codesPerFile) || codesPerFile < 1) {
        showSplitStatus('Введите корректное количество кодов (больше 0).', 'error');
        return;
    }

    const totalLines = splitFileData.length;
    const totalFiles = Math.ceil(totalLines / codesPerFile);

    // Удаляем расширение из имени файла для использования в названии папки
    const folderName = originalFileName.replace(/\.[^.]+$/, '');

    // Показываем процесс разделения
    showSplitStatus(`Начинаем разделение на ${totalFiles} файлов...`, 'info');

    let currentFileIndex = 1;

    // Разделяем данные на части и создаём файлы
    for (let i = 0; i < totalLines; i += codesPerFile) {
        // Берём часть данных: от i до i + codesPerFile (или до конца массива)
        const chunk = splitFileData.slice(i, i + codesPerFile);

        // Создаём Blob для скачивания
        const blob = new Blob([chunk.join('\r\n') + '\r\n'], {
            type: 'text/plain;charset=utf-8'
        });

        // Формируем имя файла: folderName/part_1_of_6.txt, folderName/part_2_of_6.txt и т. д.
        const fileName = `${folderName}/part_${currentFileIndex}_of_${totalFiles}.txt`;

        // Создаём ссылку для скачивания
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        currentFileIndex++;
    }

    // Показываем итоговое оповещение об успешном выполнении (упрощённое)
    showSplitStatus('Файл успешно разделён', 'success');
}

// Функция обработки содержимого для расширенной обработки
function processContent(content) {
    const lines = content.split('\n');
    const allFragments = [];

    // Шаг 1: предварительная очистка — удаляем все пробельные символы
    const cleanLines = lines.map(line => line.replace(/\s/g, ''));
        // Шаг 2: разбиваем каждую строку на фрагменты с учётом наличия 
    for (const line of cleanLines) {
        if (!line) {
            allFragments.push(''); // Сохраняем пустые строки временно
            continue;
        }

        let start = 0;
        while (start < line.length) {
            // Определяем длину фрагмента
            let chunkLength;
            if (start + 31 < line.length && line[start + 31] === '') {
                // Если после 31‑го символа есть , берём 38 символов
                chunkLength = 38;
            } else {
                // Иначе берём 37 символов
                chunkLength = 37;
            }

            const fragment = line.substring(start, start + chunkLength);

            // Пропускаем фрагменты длиной 1 символ
            if (fragment.length !== 1) {
                allFragments.push(fragment);
            }

            start += chunkLength;
        }
    }

    // Шаг 3: добавляем символ  после 31‑го столбца, если его нет
    const withSeparator = allFragments.map(fragment => {
        if (fragment.length <= 31) return fragment; // Не добавляем, если строка короче 31 символа

        // Проверяем, есть ли уже  на 32‑й позиции (индекс 31)
        if (fragment[31] === '') {
            return fragment; // Уже есть, оставляем как есть
        }

        // Вставляем  после 31‑го символа
        return fragment.substring(0, 31) + '' + fragment.substring(31);
    });

    // Шаг 4: удаляем дубликаты строк
    const uniqueFragments = [...new Set(withSeparator)];

    // Шаг 5: финальная фильтрация — удаляем строки длиной 1 символ (если появились после предыдущих операций)
    const filteredFragments = uniqueFragments.filter(fragment =>
        fragment.length !== 1
    );

    // Шаг 6: удаляем пустые строки перед финальным объединением
    const noEmptyLines = filteredFragments.filter(fragment => fragment.trim() !== '');

    // Шаг 7: объединяем строки с CR+LF в конце каждой строки, добавляем перенос в конце файла
    const result = noEmptyLines.join('\r\n') + '\r\n';

    return result;
}

// Функция автоматического сохранения в файл
function saveToFile(content, fileName) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Показываем статус сохранения
    statusElement.textContent = `Файл "${fileName}" успешно сохранён!`;
    statusElement.className = 'status success';

    setTimeout(() => {
        statusElement.textContent = '';
        statusElement.className = 'status';
    }, 3000);
}

// Функция сохранения данных в файл .txt (с вставкой символа  после 31‑го символа)
function saveDataAsFile() {
    let data = textarea.value;

    if (!data) {
        alert('Поле для сохранения пустое!');
        return;
    }

    // Получаем название продукта из соответствующего поля
    const productName = productNameField.value.trim();

    // Проверяем, заполнено ли поле названия продукта
    if (!productName || productName === 'Не определено') {
        alert('Не удалось определить название продукта. Проверьте данные в поле "Название продукта"');
        return;
    }

    // Разделяем на строки, удаляем пустые и строки с пробелами
    const lines = data.split('\n');
        const nonEmptyLines = lines.filter(line => line.trim().length > 0);

    if (nonEmptyLines.length === 0) {
        alert('Нет данных для сохранения — все строки пустые!');
        return;
    }

    // Обрабатываем каждую строку: вставляем символ  после 31-го символа только если его там ещё нет
    const processedLines = nonEmptyLines.map(line => {
        // Пропускаем обработку, если строка короче 31 символа
        if (line.length <= 31) {
            return line;
        }

        // Проверяем, есть ли уже  на 32‑й позиции (индекс 31)
        if (line[31] === '') {
            // Если символ уже есть, возвращаем строку без изменений
            return line;
        }

        // Вставляем  после 31‑го символа
        return line.slice(0, 31) + '' + line.slice(31);
    });

    // Собираем строки обратно с CRLF
    data = processedLines.join('\r\n') + '\r\n';

    // Преобразуем строку в Uint8Array для гарантированной корректной кодировки
    const uint8Array = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) {
        uint8Array[i] = data.charCodeAt(i);
    }

    // Создаём Blob с данными, явно указывая кодировку
    const blob = new Blob([uint8Array], { type: 'text/plain;charset=utf-8' });

    // Формируем имя файла: используем ТОЛЬКО название продукта
    const fileName = `${productName}.txt`;

    // Создаём ссылку для скачивания
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;

    // Добавляем ссылку в документ, имитируем клик и удаляем ссылку
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // Освобождаем память
    URL.revokeObjectURL(link.href);
}

// Функция для обновления поля sumLinesField с информацией о сумме и партии
function updateSumLinesWithParties(totalLines) {
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 300;
    const totalParties = Math.ceil(totalLines / unitsPerBatch);
    let displayText = '';

    if (totalLines === 0) {
        displayText = 'Товара: нет; партий: нет';
    } else {
        displayText = `RQ Code: ${totalLines}; Партия №${totalParties}`;
    }

    sumLinesField.value = displayText;

    // Получаем состояние чекбокса
    const soundCheckbox = document.getElementById('soundNotification');
    const isSoundEnabled = soundCheckbox && soundCheckbox.checked;

    if (!isSoundEnabled) return; // Если звук отключён, выходим


    // ПОЛУЧАЕМ ПРЕДЫДУЩЕЕ ЗНАЧЕНИЕ ПАРТИИ И ФЛАГ НУЛЕВОГО СОСТОЯНИЯ
    let previousParties = 0;
    let wasZeroParties = false;

    const storedValue = sessionStorage.getItem('lastPartyNumber');
    const storedZeroFlag = sessionStorage.getItem('wasZeroParties');

    if (storedValue !== null) {
        previousParties = parseInt(storedValue);
    }
    if (storedZeroFlag !== null) {
        wasZeroParties = storedZeroFlag === 'true';
    }

    // ФЛАГ для определения необходимости оповещения
    let shouldNotify = false;

    // УСЛОВИЕ 1: Переход от «нет партий» (0) к любой положительной партии
    if ((previousParties === 0 || wasZeroParties) && totalParties > 0) {
        shouldNotify = true;
        console.log(`🔔 Первая партия после отсутствия! Текущая: ${totalParties}`);
        // Сбрасываем флаг нулевого состояния после срабатывания
        sessionStorage.setItem('wasZeroParties', 'false');
    }
    // УСЛОВИЕ 2: Увеличение количества партий
    else if (totalParties > previousParties) {
        shouldNotify = true;
        console.log(`🔔 Новая партия! Текущая: ${totalParties}, Предыдущая: ${previousParties}`);
    }
    // УСЛОВИЕ 3: Уменьшение количества партий (например, при изменении unitsPerBatch)
    else if (totalParties < previousParties && totalParties > 0) {
        shouldNotify = true;
        console.log(`🔔 Изменение партии! Текущая: ${totalParties}, Предыдущая: ${previousParties} (уменьшение)`);
    }

    // Обновляем флаг нулевого состояния
    if (totalParties === 0) {
        sessionStorage.setItem('wasZeroParties', 'true');
    }

    // Воспроизводим звук, если нужно оповестить
    if (shouldNotify) {
        // Сохраняем новое значение
        sessionStorage.setItem('lastPartyNumber', totalParties.toString());
        // Воспроизводим звук
        playNotificationSound();
    }
}

        textarea.addEventListener('input', function() {
            // Сохраняем позицию курсора и прокрутки *до* обработки
            const cursorPosition = textarea.selectionStart;
            const scrollTop = textarea.scrollTop;

            // Разбиваем текст на строки по символу переноса (Enter)
            const lines = textarea.value.split('\n');
            const uniqueLines = new Set();
            const processedLines = [];

            // Определяем название продукта для первой подходящей строки
            let productName = 'Не определено';
            for (const line of lines) {
                const trimmedLine = line.trim();
                if (trimmedLine) {
                    productName = findProductName(trimmedLine);
            if (productName !== 'Не определено') {
                break;
            }
        }
    }
    productNameField.value = productName;

    // Получаем количество единиц в партии
    const unitsPerBatch = parseInt(document.getElementById('unitsPerBatch').value) || 300;

    let lineCounter = 0;
    let currentParty = 1;

    lines.forEach(line => {
        // Обрабатываем только непустые строки и удаляем дубликаты
        const trimmedLine = line.trim();
        if (trimmedLine && !uniqueLines.has(trimmedLine)) {
            uniqueLines.add(trimmedLine);
            lineCounter++;
            currentParty = Math.ceil(lineCounter / unitsPerBatch);
            // Сохраняем исходную строку (с переносами) без добавления CRLF внутри
            processedLines.push(line); // Важно: не добавляем \r\n здесь
        } else if (!trimmedLine) {
            // Пустые строки сохраняем как есть — это позволяет Enter работать нормально
            processedLines.push(line);
        }
    });

    // Собираем строки обратно через \n (естественные переносы)
    const newValue = processedLines.join('\n');

    // Только если содержимое реально изменилось, обновляем textarea
    if (newValue !== textarea.value) {
        textarea.value = newValue;
    }

    // Восстанавливаем позицию прокрутки
    textarea.scrollTop = scrollTop;

    // Восстанавливаем позицию курсора
    // Если длина текста не изменилась, позиция остаётся той же
    if (textarea.value.length === textarea.value.length) {
        textarea.setSelectionRange(cursorPosition, cursorPosition);
    } else {
        // Если текст изменился, ставим курсор в конец
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }

    // Обновляем счётчик строк и информацию о партиях
    updateSumLinesWithParties(uniqueLines.size);
});
