<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FormSubmit — отправка файла</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="email"], input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>Отправка файла через FormSubmit</h2>
  <p>Форма отправит файл на указанный email. Бесплатный тариф — до 1000 писем/мес.</p>

  <form action="https://formsubmit.co/sawbit@yandex.by" method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label for="email">Ваш email:</label>
      <input type="email" id="email" name="email" required placeholder="post58104@yandex.by">
    </div>
    
    <div class="form-group">
      <label for="attachment">Выберите файл:</label>
      <input type="file" id="attachment" name="attachment" required>
    </div>

    <!-- Скрытое поле для темы письма -->
    <input type="hidden" name="_subject" value="Новый файл с сайта">

    <!-- Скрытое поле для перенаправления после отправки -->
    <input type="hidden" name="_next" value="https://ваша-страница.ru/спасибо.html">

    <!-- Защита от спама -->
    <input type="text" name="_hcaptcha" style="display:none !important" tabindex="-1" autocomplete="off">

    <button type="submit">Отправить файл</button>
  </form>

  <!-- Сообщение об успешной отправке -->
  <div id="successMessage" class="success-message">
    Файл успешно отправлен! Мы свяжемся с вами в ближайшее время.
  </div>

  <script>
    // Показываем сообщение об успешной отправке после загрузки страницы
    // Это сработает, если форма перенаправляет на эту же страницу с параметром
    window.addEventListener('load', function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('success') === 'true') {
        document.getElementById('successMessage').style.display = 'block';
      }
    });
  </script>
</body>
</html>
